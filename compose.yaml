name: apimirror-backend

services:
  backend:
    image: ${DOCKERHUB_USERNAME:-local}/apimirror-backend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3001/'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-mirror-network

networks:
  api-mirror-network:
    name: api-mirror-network
    external: true
